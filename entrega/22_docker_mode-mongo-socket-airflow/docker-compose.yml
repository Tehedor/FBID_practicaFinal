x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider packages you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker compose build` to build the images.
  # image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.1.4}
  # image: apache/airflow:2.1.4
  build: ./airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    # AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
    PROJECT_HOME: /opt/airflow
    # _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins

    # 👇 TE RECOMIENDO AÑADIR TAMBIÉN ESTA (Probablemente tu script necesite datos)
    - ./airflow/resources:/opt/airflow/resources
    - ./airflow/data:/opt/airflow/data
    - ./airflow/models:/opt/airflow/models
  # user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  networks:
    - flight-network
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services: 

#############################################
# Infrestructure services
#############################################
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["infra"]
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    networks:
      - flight-network

  spark-master:
    image: apache/spark:3.5.3
    profiles: ["infra"]
    container_name: spark-master
    user: root
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker-1:
    image: apache/spark:3.5.3
    profiles: ["infra"]
    container_name: spark-worker-1
    user: root
    environment:
      SPARK_WORKER_WEBUI_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      - spark-master
    volumes:
      - ./airflow:/opt/airflow
      - ./airflow/models:/app/models
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-worker-2:
    image: apache/spark:3.5.3
    profiles: ["infra"]
    container_name: spark-worker-2
    user: root
    environment:
      SPARK_WORKER_WEBUI_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      - spark-master
    volumes:
      # - ./airflow:/app
      - ./airflow:/opt/airflow
      - ./airflow/models:/app/models
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  

  mongodb:
    image: mongo:7.0.17
    profiles: ["infra"]
    container_name: mongo
    restart: always 
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/import_distances.sh:/app/import_distances.sh
      - ./mongo/db:/data/db
      - ./mongo/data:/app/data
    working_dir: /app
    networks:
      - flight-network


#############################################
# Infrastructure Airflow services
#############################################
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    profiles: ["infraAirflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      - flight-network

  redis:
    image: redis:latest
    container_name: redis
    profiles: ["infraAirflow"]
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    restart: always
    networks:
      - flight-network

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    profiles: ["infraAirflow"]
    command: webserver
    ports:
      - 9090:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - flight-network

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    profiles: ["infraAirflow"]
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully    
    networks:
      - flight-network

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    profiles: ["infraAirflow"]
    command: celery worker
    user: "0:0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8793/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
      C_FORCE_ROOT: "true"  # <--- AÑADE ESTA LÍNEA 🟢
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - flight-network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    profiles: ["infraAirflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        function ver() {
          printf "%04d%04d%04d%04d" $${1//./ }
        }
        airflow_version=$$(gosu airflow airflow version)
        airflow_version_comparable=$$(ver $${airflow_version})
        min_airflow_version=2.1.0
        min_airflow_version_comparable=$$(ver $${min_airflow_version})
        if (( airflow_version_comparable < min_airflow_version_comparable )); then
          echo
          echo -e "\033[1;31mERROR!!!: Too old Airflow version $${airflow_version}!\e[0m"
          echo "The minimum Airflow version supported: $${min_airflow_version}. Only use this or higher!"
          echo
          exit 1
        fi
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID and AIRFLOW_GID environment variables, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/start/docker.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        # chown -R "${AIRFLOW_UID}:${AIRFLOW_GID}" /sources/{logs,dags,plugins}
        # chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      # _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _BACKEND: 'postgres'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - flight-network

  flower:
    <<: *airflow-common
    container_name: airflow-flower
    profiles: ["infraAirflow"]
    command: celery flower
    ports:
      - 5555:5555
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - flight-network


#############################################
# Training services
#############################################
  airflow-trigger:
    image: curlimages/curl:8.7.1
    container_name: airflow-trigger
    profiles: ["training"]
    # depends_on:
    #   airflow-webserver:
    #     condition: service_healthy
    networks:
      - flight-network
    command: |
      /bin/sh -c '
      echo "⏳ Esperando a que Airflow Webserver esté listo (http://airflow-webserver:8080/health)..."
      
      # FIX: Usamos ";" explícitos para que el shell no se confunda con los saltos de línea
      # while ! curl -s -f -o /dev/null http://airflow-webserver:8080/health; do echo "   ... reintentando en 5s ..."; sleep 5; done
      while ! curl -s -f -H "accept: application/json" -o /dev/null http://airflow-webserver:8080/api/v1/health; do echo "   ... reintentando en 5s ..."; sleep 5; done
      
      
      echo "✅ Webserver detectado. Esperando 10s extra..."
      sleep 10

      ts=$$(date +%s)
      
      echo "🔌 Despausando DAG flight_prediction_training..."
      curl -v -X PATCH http://airflow-webserver:8080/api/v1/dags/flight_prediction_training \
        -H "Content-Type: application/json" \
        -u airflow:airflow \
        -d "{\"is_paused\": false}"
      
      echo "🚀 Lanzando DAG flight_prediction_training..."
      curl -v -X POST http://airflow-webserver:8080/api/v1/dags/flight_prediction_training/dagRuns \
        -H "Content-Type: application/json" \
        -u airflow:airflow \
        -d "{\"dag_run_id\":\"manual__$${ts}\",\"conf\":{}}"
      
      echo "✅ Trigger completado."
      '

#############################################
# Prediction services
#############################################
  init-kafka:
    image: apache/kafka:3.9.0
    profiles: ["prediction"]
    container_name: init-kafka
    # depends_on:
    #   - kafka
    networks:
      - flight-network
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # 1. Esperamos un poco a que Kafka arranque bien (seguridad)
      echo -e '⏳ Esperando a que Kafka esté listo...'
      sleep 5 
      
      # 2. Creamos el tópico (usamos --if-not-exists para que no falle si reinicias)
      echo -e '🚀 Creando tópico flight-delay-ml-request...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-request --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-response --replication-factor 1 --partitions 1
      
      echo -e '✅ Tópico creado. Listando tópicos actuales:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  spark-submit:
    image: apache/spark:3.5.3
    profiles: ["prediction"]
    container_name: spark-submit
    user: root
    # user: airflow
    environment:
      SPARK_MASTER: "spark://spark-master:7077"
      BASE_PATH: /app
      KAFKA_URL:  "kafka:9092"
      MONGO_URL:  "mongodb://mongo:27017"
    volumes:
      - ./flight_prediction:/app
      - ./airflow/models:/app/models
    networks:
      - flight-network
    working_dir: /app
    command: [
      "/opt/spark/bin/spark-submit",
      "--master", "spark://spark-master:7077",
      "--packages", "org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3",
      "--class","es.upm.dit.ging.predictor.MakePrediction","target/scala-2.12/flight_prediction_2.12-0.1.jar"
    ]
    

  # Python Application
  python-app:
    build: ./python_app
    profiles: ["prediction"]
    container_name: python-app
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - PROJECT_HOME=/app
    # depends_on:
    #   - kafka
    #   - spark-master
    ports:
      - "5001:5001"
    networks:
      - flight-network


networks:
  flight-network:
    name: flight-network
    driver: bridge

volumes:
  postgres-db-volume:
    name: postgres-db-volume