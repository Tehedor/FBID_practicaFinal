apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090

---

# airflow-webserver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      securityContext:
        runAsUser: 50000    # Obliga a correr como usuario 50000 (Airflow)
        runAsGroup: 0       # Opcional: Grupo root (común en Bitnami/Apache)
        fsGroup: 0
      containers:
      - name: webserver
        image: stehedor/airflow-custom:latest
        command: ["airflow", "webserver"]
        ports:
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
          - name: airflow-filestore
            mountPath: /opt/airflow
      volumes:
        - name: airflow-filestore
          persistentVolumeClaim:
            claimName: airflow-filestore-pvc

---
# airflow-scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      securityContext:
        runAsUser: 50000    # Obliga a correr como usuario 50000 (Airflow)
        runAsGroup: 0       # Opcional: Grupo root (común en Bitnami/Apache)
        fsGroup: 0
      serviceAccountName: airflow-scheduler
      containers:
      - name: scheduler
        image: stehedor/airflow-custom:latest
        command: ["airflow", "scheduler"]
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
          - name: airflow-filestore
            mountPath: /opt/airflow
      volumes:
        - name: airflow-filestore
          persistentVolumeClaim:
            claimName: airflow-filestore-pvc



---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-scheduler-role
rules:
- apiGroups: [""]
  # resources: ["pods", "pods/log"]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["create", "get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-scheduler-binding
subjects:
- kind: ServiceAccount
  name: airflow-scheduler
roleRef:
  kind: Role
  name: airflow-scheduler-role
  apiGroup: rbac.authorization.k8s.io

---
# airflow-init
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: fix-volume-permissions
        image: busybox
        securityContext:
          runAsUser: 0  # Corre como root
        command: ["sh", "-c", "chown -R 50000:0 /opt/airflow && chmod -R 775 /opt/airflow"]
        volumeMounts:
          - name: airflow-filestore
            mountPath: /opt/airflow
      containers:
      - name: airflow-init
        image: stehedor/airflow-custom:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "⏳ Waiting for Postgres..."
            until pg_isready -h airflow-postgres -p 5432 -U airflow; do
              sleep 3
            done

            echo "✅ Postgres ready"

            mkdir -p /opt/airflow/{logs,dags,plugins}

            airflow db upgrade

            airflow users create \
              --username airflow \
              --password airflow \
              --firstname Admin \
              --lastname User \
              --role Admin \
              --email admin@example.com || true
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
          - name: airflow-filestore
            mountPath: /opt/airflow
      volumes:
        - name: airflow-filestore
          persistentVolumeClaim:
            claimName: airflow-filestore-pvc
