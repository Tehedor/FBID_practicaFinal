apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
---

# airflow-webserver
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
      - name: webserver
        image: stehedor/airflow-custom:latest
        command: ["airflow", "webserver"]
        ports:  
          - containerPort: 8080
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
        - name: airflow-filestore
          mountPath: /opt/airflow
      volumes:
      - name: airflow-filestore
        persistentVolumeClaim:
          claimName: airflow-filestore-pvc

---
# airflow-scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      containers:
      - name: scheduler
        image: stehedor/airflow-custom:latest
        command: ["airflow", "scheduler"]
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
        - name: airflow-filestore
          mountPath: /opt/airflow
      volumes:
      - name: airflow-filestore
        persistentVolumeClaim:
          claimName: airflow-filestore-pvc
---

# airflow-worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-worker
  template:
    metadata:
      labels:
        app: airflow-worker
    spec:
      containers:
      - name: worker
        image: stehedor/airflow-custom:latest
        command: ["airflow", "celery", "worker"]
        envFrom:
          - configMapRef:
              name: airflow-env
        env:
        - name: C_FORCE_ROOT
          value: "true"
        volumeMounts:
        - name: airflow-filestore
          mountPath: /opt/airflow
      volumes:
      - name: airflow-filestore
        persistentVolumeClaim:
          claimName: airflow-filestore-pvc
---
# flower
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-flower
  template:
    metadata:
      labels:
        app: airflow-flower
    spec:
      containers:
      - name: flower
        image: stehedor/airflow-custom:latest
        command: ["airflow", "celery", "flower"]
        ports:
          - containerPort: 5555
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
        - name: airflow-filestore
          mountPath: /opt/airflow
      volumes:
      - name: airflow-filestore
        persistentVolumeClaim:
          claimName: airflow-filestore-pvc



---
# airflow-init
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: airflow-init
        image: stehedor/airflow-custom:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            airflow db upgrade &&
            airflow users create \
              --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} \
              --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} \
              --firstname Admin \
              --lastname User \
              --role Admin \
              --email admin@example.com
        envFrom:
          - configMapRef:
              name: airflow-env
        volumeMounts:
        - name: airflow-filestore
          mountPath: /opt/airflow
      volumes:
      - name: airflow-filestore
        persistentVolumeClaim:
          claimName: airflow-filestore-pvc

