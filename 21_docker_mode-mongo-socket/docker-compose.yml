


services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    networks:
      - flight-network


  # Servicio temporal solo para crear el tópico
  init-kafka:
    image: apache/kafka:3.9.0
    container_name: init-kafka
    depends_on:
      - kafka
    networks:
      - flight-network
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # 1. Esperamos un poco a que Kafka arranque bien (seguridad)
      echo -e '⏳ Esperando a que Kafka esté listo...'
      sleep 5 
      
      # 2. Creamos el tópico (usamos --if-not-exists para que no falle si reinicias)
      echo -e '🚀 Creando tópico flight-delay-ml-request...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-request --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-response --replication-factor 1 --partitions 1
      
      echo -e '✅ Tópico creado. Listando tópicos actuales:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "


  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    environment:
      SPARK_WORKER_WEBUI_PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      - spark-master
    volumes:
      - ../10_local/practica_creativa/models:/app/models
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    environment:
      SPARK_WORKER_WEBUI_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      - spark-master
    volumes:
      - ../10_local/practica_creativa/models:/app/models
    networks:
      - flight-network
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  
  spark-submit:
    image: apache/spark:3.5.3
    container_name: spark-submit
    environment:
      SPARK_MASTER: "spark://spark-master:7077"
      BASE_PATH: /app/
      KAFKA_URL:  "kafka:9092"
      MONGO_URL:  "mongodb://mongo:27017"
      # SPARK_SUBMIT_OPTS: "--packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3"
    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully 
    volumes:
      - ./practica_creativa/flight_prediction/:/app/
      - ./practica_creativa/models:/app/models
    networks:
      - flight-network
    working_dir: /app
    user: root
    command: [
      "/opt/spark/bin/spark-submit",
      "--master", "spark://spark-master:7077",
      "--packages", "org.mongodb.spark:mongo-spark-connector_2.12:10.4.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3",
      "--class","es.upm.dit.ging.predictor.MakePrediction","target/scala-2.12/flight_prediction_2.12-0.1.jar"
    ]
    

  # Python Application
  python-app:
    build: ./python_app
    container_name: python-app
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - KAFKA_HOST=kafka
      - KAFKA_PORT=9092
      - PROJECT_HOME=/app
    depends_on:
      - kafka
      - spark-master
    ports:
      - "5001:5001"
    networks:
      - flight-network

  mongodb:
    image: mongo:7.0.17
    container_name: mongo
    restart: always 
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/import_distances.sh:/app/import_distances.sh
      - ./mongo/db:/data/db
      - ./mongo/data:/app/data
    working_dir: /app
    networks:
      - flight-network

networks:
  flight-network:
    driver: bridge