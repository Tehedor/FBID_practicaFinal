apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-local-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany      
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: ${AIRFLOW_FILESTORE_PATH}
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-filestore-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
