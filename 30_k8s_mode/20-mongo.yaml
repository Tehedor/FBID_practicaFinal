apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0.17
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            # Si necesitas importar scripts, deberías usar un ConfigMap o copiar el archivo en la imagen
            # - name: import-script
            #   mountPath: /app/import_distances.sh
      volumes:
        - name: mongo-data
          emptyDir: {} # Los datos se pierden al reiniciar el pod. Usa PVC para persistencia real.